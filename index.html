<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Колесо вкусов</title>
  <style>
    html {
      scrollbar-gutter: stable;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        repeating-linear-gradient(
          128deg,
          transparent 0 56px,
          rgba(0, 0, 0, 0.012) 56px 64px,
          transparent 64px 120px
        ),
        repeating-linear-gradient(
          128deg,
          transparent 0 22px,
          rgba(255, 255, 255, 0.5) 22px 30px,
          transparent 30px 88px
        ),
        #fafaf8;
      color: #000000;
    }
    body {
      font-family: Mulish, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    flavor-wheel {
      display: block;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px;
      box-sizing: border-box;
    }
    @media (min-width: 1280px) {
      flavor-wheel { padding: 32px; }
    }
  </style>
</head>
<body>
  <flavor-wheel sync-url="true">
    <noscript>Для интерактивного колеса вкусов включите JavaScript.</noscript>
  </flavor-wheel>
  <script type="module" src="./flavor-wheel/flavor-wheel.js"></script>
</body>
</html>
