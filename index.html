<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Колесо вкусов</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f7f5;
      color: #101010;
    }
    body {
      font-family: Mulish, Arial, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    flavor-wheel {
      display: block;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      box-sizing: border-box;
    }
    @media (min-width: 1280px) {
      flavor-wheel { padding: 48px 32px 64px; }
    }
  </style>
</head>
<body>
  <flavor-wheel sync-url="true">
    <noscript>Для интерактивного колеса вкусов включите JavaScript.</noscript>
  </flavor-wheel>
  <script type="module" src="./flavor-wheel/flavor-wheel.js"></script>
</body>
</html>
